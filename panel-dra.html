<style>
:root{
  --paper:#FFF9F0;--panel:#fff;--panel2:#F3F8FD;--ink:#1E2A36;--muted:#465464;--line:#E4DCCD;
  --azul:#1A4F86;--azul2:#1F6FB2;--soft:#E3F0FB;--verde:#4C8C1F;--verdeSoft:#E9F5DC;
  --lav:#8E5FC8;--lavd:#6B3FB0;--lavSoft:#EDE3FB;
  --oro:#D4AF55;--oroInk:#8C6A1A;--oroSoft:#FBF4DE;--oroGrad:linear-gradient(135deg,#F6E3A1 0%,#D9B65E 45%,#B8892E 100%);
  --zV:#3D7A14;--zA:#B58A00;--zR:#C0312B;--zVs:#E3F2D6;--zAs:#FBF0C8;--zRs:#FBE0DD;
  --display:"Cormorant Garamond",Georgia,serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.5 var(--body)}
a{color:var(--azul2)}
header.top{background:linear-gradient(135deg,#1F6FB2 0%,#2B86C9 45%,#4C8C1F 100%);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top img{width:54px;height:54px;border-radius:50%;background:#fff;padding:4px;object-fit:contain;box-shadow:0 0 0 3px var(--oro)}
header.top .t{flex:1;min-width:200px}
header.top b{font:700 1.7rem var(--display);display:block;line-height:1.1}
header.top small{font-weight:700;opacity:.95}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;padding:10px 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
nav.tabs button{font:800 .92rem var(--body);border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:12px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--lavd);color:#fff}
nav.tabs .sp{flex:1}
main{max-width:1280px;margin:0 auto;padding:20px 22px 60px}
h1,h2,h3{font-family:var(--display);color:var(--azul);margin:0;line-height:1.15}
h1{font-size:2.2rem}h2{font-size:1.7rem}h3{font-size:1.35rem}
p{margin:0}
.note{color:var(--muted);font-size:.95rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 4px 16px rgba(31,111,178,.06);display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border-radius:18px;padding:16px;color:#fff}
.kpi b{display:block;font:700 2.5rem var(--display);line-height:1}
.kpi span{font-weight:700;font-size:.95rem}
.k1{background:linear-gradient(135deg,#1F6FB2,#3A95D8)}.k2{background:linear-gradient(135deg,#4C8C1F,#74AE33)}
.k3{background:linear-gradient(135deg,#6B3FB0,#9B6FD6)}.k4{background:var(--oroGrad);color:#3A2A05}
.k5{background:linear-gradient(135deg,#1A4F86,#1F6FB2)}.k6{background:linear-gradient(135deg,#B3261E,#D9534A)}
.btn{font:800 1rem var(--body);padding:11px 20px;border-radius:40px;border:2px solid var(--azul2);background:var(--azul2);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.gold{background:var(--oroGrad);border-color:#C9A24A;color:#3A2A05}
.btn.lav{background:var(--lavd);border-color:var(--lavd)}
.btn.ghost{background:transparent;color:var(--azul2)}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
input,select,textarea{font:1rem var(--body);padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--azul2);outline:none;box-shadow:0 0 0 3px var(--soft)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th{text-align:left;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--lavd);padding:8px 10px;border-bottom:2px solid var(--lavSoft);cursor:pointer;white-space:nowrap;user-select:none}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:var(--panel2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td:first-child{white-space:nowrap}
.scroll{overflow-x:auto}
.z{display:inline-block;min-width:28px;text-align:center;padding:2px 9px;border-radius:20px;font-weight:800;font-size:.82rem}
.zV{background:var(--zVs);color:var(--zV)}.zA{background:var(--zAs);color:var(--zA)}.zR{background:var(--zRs);color:var(--zR)}
.chip{display:inline-block;padding:2px 10px;border-radius:20px;font-weight:800;font-size:.82rem;background:var(--soft);color:var(--azul)}
.chip.plan{background:var(--lavSoft);color:var(--lavd)}
.chip.warn{background:var(--zRs);color:var(--zR)}
.chip.oro{background:var(--oroSoft);color:var(--oroInk)}
.bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--verde),#74AE33)}
.hbar{display:grid;grid-template-columns:minmax(120px,200px) 1fr 110px;gap:10px;align-items:center;font-size:.95rem}
.hbar .b{height:22px;border-radius:8px;background:var(--panel2);overflow:hidden}
.hbar .b i{display:block;height:100%;border-radius:8px}
.stack{display:flex;height:34px;border-radius:12px;overflow:hidden;font-weight:800;font-size:.9rem}
.stack div{display:flex;align-items:center;justify-content:center;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.att{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.att:last-child{border:0}
.att .ic{font-size:1.4rem}
.att .tx{flex:1}
.empty{color:var(--muted);text-align:center;padding:18px}
/* ficha */
.back{margin-bottom:12px}
.fhead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.fhead .id{flex:1;min-width:240px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}
.dl dt{color:var(--muted);font-weight:700}.dl dd{margin:0}
.cal{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.cal div{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;background:#fff}
.cal div small{font-size:.65rem;font-weight:800;color:var(--lavd)}
.cal .s{border-color:var(--oro);border-width:2.5px}
.cal .full{background:var(--verde);color:#fff;border-color:var(--verde)}.cal .full small{color:#fff}
.cal .part{background:var(--verdeSoft)}
.cal .fut{opacity:.35}
.cal .hoy{outline:3px solid var(--azul2)}
.dims{display:grid;grid-template-columns:130px 1fr 112px;gap:8px 10px;align-items:center;align-content:start;font-size:.92rem}
.dims .pair{display:flex;flex-direction:column;gap:3px}
.dims .pair i{display:block;height:9px;border-radius:6px}
.delta{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.mejor{color:var(--zV)}.peor{color:var(--zR)}
.escrito{border-left:5px solid var(--lav);background:var(--lavSoft);border-radius:0 14px 14px 0;padding:10px 14px}
.escrito b{color:var(--lavd);font-size:.88rem;display:block}
.escrito p{white-space:pre-line}
.priv{background:var(--oroSoft);border-left:6px solid var(--oro);padding:12px 14px;border-radius:12px;font-size:.95rem}
.sig{background:var(--zVs)}
.login{max-width:460px;margin:50px auto}
.codein{font:800 1.8rem var(--body)!important;letter-spacing:.4em;text-align:center;width:100%}
.fb{min-height:1.2em;font-size:.95rem}.fb.bad{color:var(--zR)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--oro);display:inline-block;vertical-align:middle;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
svg text{font-family:var(--body)}
.fbar{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--lavd);border-radius:18px;padding:14px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.fbar .filters label{font-size:.82rem}
.fbar select,.fbar input{font-size:.92rem;padding:7px 10px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.fchips .chip{background:var(--lavSoft);color:var(--lavd)}
.mapa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:900px){.mapa{grid-template-columns:1fr}}
.prot{border-radius:16px;padding:14px;border:2px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.prot.R{border-color:var(--zR);background:#FFF7F6}.prot.A{border-color:var(--zA);background:#FFFCF0}
.prot h4{margin:0;font:700 1.2rem var(--display);color:var(--azul)}
.prot .tag{display:flex;flex-wrap:wrap;gap:5px}
.prot .tag span{background:var(--panel2);border-radius:10px;padding:2px 8px;font-size:.85rem}
.prot .dec{background:var(--oroSoft);border-left:4px solid var(--oro);padding:6px 10px;border-radius:8px;font-style:italic}
.nota{border-left:5px solid var(--azul2);background:var(--panel2);border-radius:0 12px 12px 0;padding:10px 14px}
.nota b{color:var(--azul2);font-size:.88rem}
.nota p{white-space:pre-line}
.rep{background:#fff;border-radius:20px;padding:28px;border:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.rep .rhead{display:flex;gap:16px;align-items:center;border-bottom:4px solid var(--oro);padding-bottom:12px}
.rep .rhead img{width:120px}
.rep h2{font-size:1.6rem}.rep h3{font-size:1.25rem;color:var(--lavd)}
.rep .tbl tbody tr{cursor:default}
.npsbar svg,.npsbar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.npsbar{display:flex;height:30px;border-radius:10px;overflow:hidden;font-weight:800;font-size:.85rem;color:#fff}
.npsbar div{display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.coment{border-left:4px solid var(--lav);padding:6px 12px;background:var(--lavSoft);border-radius:0 10px 10px 0;margin:4px 0;font-size:.95rem}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;font-size:11.5pt}
  header.top,nav.tabs,.noprint,.fbar,.back,button{display:none!important}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .rep{box-shadow:none;border:0;padding:0}
  .tbl{font-size:9.5pt}.tbl th,.tbl td{padding:4px 6px}
  .rep h3{break-after:avoid}
  .grid.g2,.grid.g3{grid-template-columns:1fr 1fr}
  .kpi,.stack div,.npsbar div,.hbar .b i,.z,.chip,.cal div,.prot,.dec{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pb{break-before:page}
  a{color:inherit;text-decoration:none}
}
</style>

function indexar(d) {
  const ev = {}, ci = {}, sg = {}, al = {};
  d.evaluaciones.forEach(e => (ev[e.codigo] = ev[e.codigo] || []).push(e));
  Object.values(ev).forEach(a => a.sort((x, y) => new Date(x.fecha) - new Date(y.fecha)));
  d.ciclos.forEach(c => (ci[c.codigo] = ci[c.codigo] || []).push(c));
  d.seguimiento.forEach(s => (sg[s.codigo + '|' + s.eval_id] = sg[s.codigo + '|' + s.eval_id] || []).push(s));
  d.alertas.forEach(a => (al[a.codigo] = al[a.codigo] || []).push(a));
  const orgN = {}; d.organizaciones.forEach(o => orgN[o.org_id] = o.nombre);
  const P = d.personas.map(p => {
    const es = ev[p.codigo] || [], cs = ci[p.codigo] || [], act = cs.find(c => c.estado === 'ACTIVO') || null, ult = es[es.length - 1] || null;
    const seg = act ? (sg[p.codigo + '|' + act.eval_id] || []).sort((a, b) => a.dia - b.dia) : [];
    const an = seg.filter(s => s.animo != null);
    return Object.assign({}, p, { evals: es, ult, pri: es[0] || null, ciclos: cs, act, seg,
      org: (p.perfil && p.perfil.org_id) || '', orgNombre: orgN[(p.perfil && p.perfil.org_id) || ''] || '',
      animoUlt: an.length ? an[an.length - 1].animo : null, animoProm: an.length ? an.reduce((a, b) => a + b.animo, 0) / an.length : null,
      sinRegistro: act && act.dia <= 30 ? (act.ultimo_registro ? diasDesde(act.ultimo_registro) : Math.max(0, (act.dia || 1) - 1)) : null,
      alertasPend: (al[p.codigo] || []).filter(a => a.estado !== 'REVISADO').length });
  });
  return { P, porCod: Object.fromEntries(P.map(p => [p.codigo, p])), orgN };
}

function pantallaEntrar(err) {
  $('#tabs').hidden = true;
  const em = h('input', { type: 'email', id: 'email', value: 'direccion@mielsy.org', autocomplete: 'email', style: 'width:100%' });
  const fb = h('p', { class: 'fb' + (err ? ' bad' : '') }, err ? msg(err) : '');
  $('#main').replaceChildren(h('div', { class: 'card login' }, h('h1', {}, 'Entrar al panel'),
    h('p', {}, 'Solo para la dirección clínica. Le enviaremos un código a su correo institucional.'),
    h('label', { style: 'font-weight:700;display:flex;flex-direction:column;gap:6px' }, 'Correo', em), fb,
    h('button', { class: 'btn lav', id: 'btnCodigo', onclick: async e => {
      e.target.disabled = true; fb.className = 'fb'; fb.textContent = 'Enviando…';
      const r = await api('enviarCodigo', { email: em.value.trim().toLowerCase(), para: 'panel' }); e.target.disabled = false;
      if (!r.ok) { fb.className = 'fb bad'; fb.textContent = msg(r.error); return; }
      pantallaCodigo(em.value.trim().toLowerCase());
    } }, 'Enviarme el código')));
}
function pantallaCodigo(email) {
  const code = h('input', { id: 'code', class: 'codein', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 6 });
  const fb = h('p', { class: 'fb' });
  const entrar = async () => {
    fb.className = 'fb'; fb.textContent = 'Verificando…';
    const r = await api('panelEntrar', { email, code: code.value });
    if (!r.ok) { fb.className = 'fb bad'; fb.textContent = msg(r.error); return; }
    LS.set('mielsy.panel', r.sesionAdmin); cargar();
  };
  code.addEventListener('input', () => { code.value = code.value.replace(/\D/g, '').slice(0, 6); if (code.value.length === 6) entrar(); });
  $('#main').replaceChildren(h('div', { class: 'card login' }, h('h2', {}, 'Revise su correo'),
    h('p', {}, 'Si ', h('b', {}, email), ' tiene acceso, le llegó un código de 6 números.'), code, fb,
    h('button', { class: 'btn lav', onclick: entrar }, 'Entrar')));
  code.focus();
}
async function cargar() {
  const ses = LS.get('mielsy.panel'); if (!ses) return pantallaEntrar();
  $('#main').replaceChildren(h('div', { class: 'card' }, h('p', {}, h('span', { class: 'spin' }), '  Cargando datos…')));
