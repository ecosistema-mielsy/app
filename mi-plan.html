body{margin:0;background:var(--paper);color:var(--ink);font:19px/1.6 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 90px}
header{display:flex;align-items:center;gap:14px;padding:16px 18px;margin:0 -16px 0;color:#fff;
  background:linear-gradient(135deg,#1F6FB2 0%,#2B86C9 45%,#4C8C1F 100%);border-radius:0 0 26px 26px}

header .who{flex:1;min-width:0}
header b{font:700 1.75rem var(--display);color:#fff;line-height:1.1;display:block}
header small{color:#fff;opacity:.95;font-size:.95rem;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stripe{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--azul2),var(--verde),#D4AF55,var(--lavd));margin:14px 0 18px}
h1,h2,h3{font-family:var(--display);color:var(--azul);margin:0;line-height:1.15}
h1{font-size:2.3rem}h2{font-size:1.85rem}h3{font-size:1.45rem}
p{margin:0}
a{color:var(--azul2);overflow-wrap:anywhere}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:0 4px 16px rgba(31,111,178,.07);display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.note{color:var(--muted);font-size:1rem}
.btn{font:800 1.08rem var(--body);padding:14px 24px;border-radius:40px;border:2px solid var(--azul2);background:var(--azul2);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.gold{background:var(--oroGrad);border-color:#C9A24A;color:#3A2A05}
.btn.green{background:var(--verde);border-color:var(--verde)}
.btn.green{background:var(--verde);border-color:var(--verde)}
.btn.ghost{background:transparent;color:var(--azul2)}
.btn.small{padding:9px 16px;font-size:1rem}
.btn:disabled{opacity:.45;cursor:default}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.gold):not(.ghost){color:#10202E}}
:focus-visible{outline:3px solid var(--azul2);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:1.05rem}
input[type=email],input[type=text],textarea{font:1.08rem var(--body);padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);width:100%}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input:focus,textarea:focus{border-color:var(--azul2);outline:none;box-shadow:0 0 0 3px var(--soft)}
.codein{font:800 1.9rem var(--body)!important;letter-spacing:.45em;text-align:center}
.fb{min-height:1.2em;font-size:1.02rem}.fb.bad{color:var(--bad)}.fb.ok{color:var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center}
.tabs div{display:grid;grid-template-columns:repeat(var(--ntabs,4),1fr);max-width:760px;width:100%}
.tabs button{background:none;border:0;padding:9px 4px 12px;font:800 .9rem var(--body);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:1.5rem;line-height:1}
.tabs button[aria-current="page"]{color:var(--lavd);box-shadow:inset 0 4px 0 var(--dorado)}
.tabs button[aria-current="page"] span{transform:scale(1.12)}
/* día */
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dayhead .n{font:700 2.8rem var(--display);color:var(--azul2);line-height:1}
.dayhead .n small{font:700 1.1rem var(--body);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:30px;font-weight:800;font-size:.95rem;background:var(--soft);color:var(--azul)}
.chip.ses{background:var(--oroGrad);color:#3A2A05}
.chip.ok{background:var(--verdeSoft);color:var(--verde)}
.daynav{display:flex;justify-content:space-between;gap:8px;margin:4px 0 14px}
.semana{background:linear-gradient(135deg,#9B6FD6 0%,#6B3FB0 100%);border:0;border-left:8px solid var(--dorado);color:#fff;box-shadow:0 10px 26px rgba(107,63,176,.3)}
.semana .t{font:700 1.6rem var(--display);color:#fff}
.semana b{color:#F6E3A1}
.etapa{display:flex;align-items:center;gap:10px;margin-top:6px;padding-top:12px;border-top:1px dashed var(--line)}
.etapa:first-child{border-top:0;padding-top:0;margin-top:0}
.etapa h3{flex:1}
.etapa h3{color:var(--azul2)}
.etapa .min{font-weight:800;font-size:.95rem;color:var(--doradoInk);background:var(--doradoSoft);padding:3px 10px;border-radius:20px;white-space:nowrap}
.item b{display:block;color:var(--verde);font-size:1rem;letter-spacing:.01em}
.item p{white-space:pre-line}
.decreto{background:linear-gradient(135deg,#F8EBC2,#EDE3FB);border:2px solid var(--dorado);border-radius:16px;padding:18px;font:700 1.6rem/1.35 var(--display);color:var(--ink);text-align:center}
.decreto small{display:block;font:800 .85rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--doradoInk);margin-bottom:6px}
.dra{border-left:4px solid var(--lavd);background:var(--panel2);border-radius:0 14px 14px 0;padding:12px 14px}
.dra b{display:block;font-size:.92rem;color:var(--lavd);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.dra p{white-space:pre-line;font-style:italic}
.check{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{margin-top:3px;width:22px;height:22px;accent-color:var(--verde);flex:none}
.micro{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.micro.m{background:var(--doradoSoft);border-left:6px solid var(--dorado)}.micro.n{background:var(--lavSoft);border-left:8px solid var(--lavd);box-shadow:0 4px 14px rgba(107,63,176,.15)}.micro.u{background:var(--verdeSoft);border-left:6px solid var(--verde)}
.micro .k{font-weight:800;font-size:1rem;color:var(--doradoInk)}
.micro.n .k{color:var(--lavd)}.micro.u .k{color:var(--verde)}
.micro p{white-space:pre-line}
.animo{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.animo label{position:relative}
.animo input{position:absolute;opacity:0;pointer-events:none}
.animo span{display:block;text-align:center;padding:9px 0;border:1.5px solid var(--line);border-radius:10px;font-weight:800;cursor:pointer;background:var(--panel)}
.animo span{font-size:1.05rem}
.animo input:checked+span{background:var(--verde);border-color:var(--verde);color:#fff}
.animo input:focus-visible+span{outline:3px solid var(--azul2);outline-offset:2px}
.saved{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--verde);font-size:1rem!important;color:#fff;padding:7px 16px;border-radius:30px;font-weight:700;font-size:.85rem;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none}
.saved.on{opacity:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .saved{color:#10202E}}
.base{background:var(--doradoSoft);border-color:transparent}
/* Mis puntos MIELSY */
.mispuntos{border:2px solid var(--lav);background:linear-gradient(180deg,var(--lavSoft),var(--panel) 160px)}
.mpchips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.mpchip{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:30px;padding:8px 14px;font:800 .98rem var(--body);cursor:pointer}
.mpchip .mpdot{width:12px;height:12px;border-radius:50%}
.mpchip.R .mpdot{background:#D93A3A}.mpchip.A .mpdot{background:#E8B419}
.mpchip[aria-pressed=true]{border-color:var(--lavd);background:var(--lavd);color:#fff}
.mpchip.ancla{border-style:dashed}
.mptit{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 4px;font:700 1.35rem/1.2 var(--display);color:var(--azul)}
.mpest{font:800 .85rem var(--body);padding:3px 10px;border-radius:20px}
.mpest.R{background:#FDE2E2;color:#9B1C1C}.mpest.A{background:#FFF3C4;color:#7A5A00}
.mplista{margin:4px 0 12px;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.mptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.mptabs button{flex:1;min-width:92px;border:2px solid var(--line);background:var(--panel);color:var(--azul);border-radius:12px;padding:9px 8px;font:800 1rem var(--body);cursor:pointer}
.mptabs button small{font-weight:600;color:var(--muted)}
.mptabs button[aria-pressed=true]{background:var(--azul2);border-color:var(--azul2);color:#fff}
.mptabs button[aria-pressed=true] small{color:#E3F0FB}
.mpmarco{border:1.5px solid var(--line);border-radius:14px;background:#fff;overflow:auto;max-height:70vh}
.mplienzo{position:relative;width:100%;line-height:0}
.mplienzo.zoom{width:230%}
.mplienzo img{width:100%;height:auto;display:block}
.mplienzo svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mplienzo .halo{fill:#F6E3A155;stroke:#C9962B;stroke-width:5;stroke-dasharray:9 5;animation:mppulso 1.8s ease-in-out infinite}
.mplienzo .tenue{fill:none;stroke:#8A94A3;stroke-width:3;stroke-dasharray:5 6;opacity:.7}
.mplienzo .centro{fill:#C9962B}
@keyframes mppulso{50%{stroke-width:9;fill:#F6E3A199}}
@media (prefers-reduced-motion:reduce){.mplienzo .halo{animation:none}}
.mpbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 4px}
.mpbar .note{margin:0}
.mpcomo{margin-top:10px;background:var(--doradoSoft);border-radius:14px;padding:12px 14px}
.mpcomo summary{font-weight:800;color:var(--doradoInk);cursor:pointer}
.mpcomo ol{margin:8px 0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
@media print{.mpmarco{max-height:none;overflow:visible}.mplienzo.zoom{width:100%}}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal button{aspect-ratio:1;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);font:800 1rem var(--body);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.cal button{font-size:1.15rem!important}
.cal button small{font-size:.62rem;font-weight:800;color:var(--doradoInk)}
.cal button.ses{border-color:var(--dorado);border-width:2.5px;background:var(--doradoSoft)}
.cal button.full{background:var(--verde);border-color:var(--verde);color:#fff}
.cal button.full small{color:#fff}
.cal button.part{background:var(--verdeSoft)}
.cal button.hoy{outline:3px solid var(--azul2);outline-offset:1px}
.cal button:disabled{opacity:.4;cursor:default}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cal button.full{color:#10202E}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.95rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px;border:1.5px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--panel2);border-radius:14px;padding:12px;text-align:center}
.stats div:nth-child(1){background:var(--verdeSoft)}.stats div:nth-child(2){background:var(--soft)}.stats div:nth-child(3){background:var(--doradoSoft)}
.stats b{display:block;font:700 2.4rem var(--display);color:var(--azul2)}
.stats div:nth-child(1) b{color:var(--verde)}.stats div:nth-child(3) b{color:var(--doradoInk)}
.stats small{color:var(--ink);font-weight:700;font-size:.92rem}
.kit{display:grid;grid-template-columns:1fr;gap:0}
.kit div{padding:9px 0;border-bottom:1px solid var(--line)}
.kit div:last-child{border:0}
.kit b{display:block;font-size:1.02rem}
.kit span{color:var(--muted);font-size:1rem}
details{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel)}
details summary{font-weight:800;cursor:pointer;color:var(--azul)}
details[open] summary{margin-bottom:8px}
.diario article{padding:12px 0;border-bottom:1px solid var(--line)}
.diario article:last-child{border:0}
.diario b{color:var(--lavd);font-size:.95rem}
.diario p{white-space:pre-line}
.locked{color:var(--muted);text-align:center;padding:30px 10px}
.cierreCta{background:linear-gradient(135deg,#9B6FD6 0%,#6B3FB0 100%);border:0;border-left:8px solid var(--dorado);color:#fff}
.cierreCta h2{color:#fff}
.secC{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#9B6FD6,#6B3FB0);color:#fff;border-radius:18px;padding:14px 16px}
.secC b{font:700 2rem var(--display);width:46px;height:46px;border-radius:50%;background:var(--oroGrad);color:#3A2A05;display:flex;align-items:center;justify-content:center;flex:none}
.secC div{font:700 1.35rem var(--display);line-height:1.2}
.secC small{display:block;font:600 .95rem var(--body);opacity:.95}
.pq{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.pq:first-of-type{border-top:0}
.pq>b{font-size:1.05rem}
.pq.miss>b::after{content:" · falta responder";color:var(--bad)}
.esc{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:5px}
.esc label{position:relative}.esc input{position:absolute;opacity:0;pointer-events:none}
.esc span{display:block;text-align:center;padding:10px 0;border:1.5px solid var(--line);border-radius:12px;font-weight:800;cursor:pointer;background:var(--panel)}
.esc input:checked+span{background:var(--lavd);border-color:var(--lavd);color:#fff}
.esc input:focus-visible+span{outline:3px solid var(--azul2);outline-offset:2px}
.extremos{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;color:var(--muted);font-weight:700}
.nps span{padding:9px 0}
.nps label:nth-child(-n+7) input:checked+span{background:#C0312B;border-color:#C0312B}
.nps label:nth-child(n+8):nth-child(-n+9) input:checked+span{background:#B58A00;border-color:#B58A00}
.nps label:nth-child(n+10) input:checked+span{background:var(--verde);border-color:var(--verde)}
@media (max-width:480px){.nps{--n:6!important}}
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:0;padding:0;cursor:pointer;display:block}
.video img{width:100%;height:100%;object-fit:cover;opacity:.85}
.video span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.video span i{width:68px;height:48px;border-radius:14px;background:rgba(200,40,40,.92);display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:1.4rem}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vtitle{font-weight:800;font-size:1rem;color:var(--lavd);text-transform:uppercase;letter-spacing:.06em}
footer{color:var(--muted);font-size:.92rem;text-align:center;margin-top:20px;line-height:1.5}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--dorado);display:inline-block;vertical-align:middle;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:420px){.dayhead .n{font-size:2rem}.animo{grid-template-columns:repeat(5,1fr)}}
</style>

function vProgreso() {
  const a = P.adherencia || { dias: 0, sesiones: 0, pct: 0 }, hasta = Math.min(P.dia, P.duracion);
  const pts = []; for (let d = 1; d <= hasta; d++) { const r = P.registros[d]; if (r && r.animo) pts.push([d, r.animo]); }
  const out = [h('div', { class: 'card' }, h('h2', {}, 'Mi progreso'),
    h('div', { class: 'stats' }, h('div', {}, h('b', {}, (a.pct || 0) + '%'), h('small', {}, 'del plan realizado')), h('div', {}, h('b', {}, String(a.dias)), h('small', {}, 'días con registro')), h('div', {}, h('b', {}, a.sesiones + '/4'), h('small', {}, 'sesiones'))),
    h('p', { class: 'note' }, 'Cuenta lo que marcas como hecho en cada día. Al día 30 te invitaremos a repetir el IEBI-M13 para medir tu cambio.'))];
  if (pts.length) out.push(h('div', { class: 'card' }, h('h3', {}, 'Mi ánimo'), grafico(pts, hasta)));
  const diario = h('div', { class: 'diario' });
  for (let d = hasta; d >= 1; d--) {
    const r = P.registros[d]; if (!r || !r.textos) continue;
    const x = D(d);
    Object.keys(r.textos).forEach(k => {
      if (!String(r.textos[k]).trim()) return;
      let etq = 'Mi registro';
      if (k[0] === 'b' && x.bloques) { const b = x.bloques[Number(k.slice(1))]; if (b) etq = b.t === 'decreto' ? 'Mi decreto' : b.etq; }
      diario.append(h('article', {}, h('b', {}, 'Día ' + d + ' · ' + etq), h('p', {}, r.textos[k])));
    });
  }
  out.push(h('div', { class: 'card' }, h('h3', {}, 'Mi diario'), diario.childNodes.length ? diario : h('p', { class: 'note' }, 'Aquí aparecerá lo que escribas en tus sesiones y micromomentos.')));
  return out;
}
function grafico(pts, hasta) {
  const W = 600, H = 200, px = 34, py = 16, x = d => px + (d - 1) * (W - 2 * px) / Math.max(1, P.duracion - 1), y = v => H - py - (v - 1) * (H - 2 * py) / 9;
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Ánimo por día: ' + pts.map(p => `día ${p[0]}: ${p[1]}`).join(', '));
  svg.style.width = '100%'; svg.style.height = 'auto';
  const el = (t, a) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); svg.append(e); return e; };
  [1, 5, 10].forEach(v => { el('line', { x1: px, x2: W - px, y1: y(v), y2: y(v), stroke: 'currentColor', 'stroke-opacity': .12 }); el('text', { x: 2, y: y(v) + 6, 'font-size': 17, 'font-weight': 700, fill: 'currentColor', 'fill-opacity': .6 }).textContent = v; });
  P.diasSesion.forEach(d => el('line', { x1: x(d), x2: x(d), y1: py, y2: H - py, stroke: '#C9A24A', 'stroke-opacity': .8, 'stroke-dasharray': '3 4' }));
  if (pts.length > 1) el('polyline', { points: pts.map(p => x(p[0]) + ',' + y(p[1])).join(' '), fill: 'none', stroke: '#4C8C1F', 'stroke-width': 4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
  pts.forEach(p => el('circle', { cx: x(p[0]), cy: y(p[1]), r: 7, fill: '#4C8C1F' }));
  const w = h('div', { style: 'color:var(--ink)' }); w.append(svg);
  w.append(h('p', { class: 'note' }, 'Líneas doradas: días de sesión.'));
  return w;
}

  D: ['Tu motivación para continuar', 'Qué tan motivado/a te sientes para seguir este camino.', [
    ['q17', 'Después de estos 30 días, ¿qué tan motivado/a te sientes para continuar con MIELSY?', 'Sin motivación', 'Muy motivado/a'],
    ['q18', '¿Sientes que MIELSY puede seguir aportando a tu bienestar a largo plazo?', 'No lo creo', 'Totalmente']]]
};
const CL = {
  q9: ['¿Cuál(es) de las prácticas realizaste con mayor regularidad?', ['PadSensorial MIELSY (almohadilla terapéutica)', 'AromaSensorial MIELSY (aromaterapia)', 'Escritura Sensorial MIELSY (diario / decreto)', 'CromoSensorial MIELSY (colores / rueda emocional)', 'SonoSensorial MIELSY (música / frecuencias)', 'Micromomentos diarios', 'Hábitos del Estilo de Vida MIELSY (sueño / alimentación / movimiento)', 'Auriculoterapia Sensoemocional MIELSY', 'Su Jok Sensorial MIELSY']],
  q10: ['¿Qué te dificultó mantener el programa?', ['Falta de tiempo', 'Olvidaba hacerlo', 'No sentía los resultados al inicio', 'Las instrucciones no estaban del todo claras', 'Factores externos (trabajo, familia, viajes)', 'No tuve ninguna dificultad significativa']],
  q19: ['¿Qué te motiva a seguir practicando MIELSY?', ['Los resultados que ya noté en mi bienestar', 'Es fácil de integrar a mi vida diaria', 'El apoyo de mi terapeuta / comunidad MIELSY', 'Los productos sensoriales (PadSensorial, aromas, etc.)', 'Quiero seguir mejorando mis dimensiones de bienestar', 'Me gusta el enfoque natural y sin fármacos', 'Quiero aprender más sobre mi propio cerebro y bienestar', 'Recomendación de alguien cercano que también usa MIELSY']],
  q20: ['¿Cuál es tu próximo paso con MIELSY?', ['Continuar el programa por otro ciclo de 30 días', 'Hacer la evaluación IEBI-M13 para revisar mis avances', 'Explorar la certificación profesional MIELSY', 'Recomendar MIELSY a alguien cercano', 'Incorporar MIELSY en mi empresa o lugar de trabajo', 'Aún no lo sé, necesito pensarlo']]
};
function vCierre() {
  const draftK = 'mielsy.cierre.borrador.' + P.codigo + P.inicio;
  const R = Object.assign({ q9: [], q10: [], q19: [], q20: [] }, P.cierre || LS.get(draftK) || {});
  const guardaBorrador = () => LS.set(draftK, R);
  const escala = (k, a, b, n = 5, desde = 1) => {
    const g = h('div', { class: 'esc' + (n > 5 ? ' nps' : ''), role: 'radiogroup', style: '--n:' + n });
    for (let i = desde; i < desde + n; i++) { const inp = h('input', { type: 'radio', name: k, value: i }); inp.checked = R[k] === i; inp.onchange = () => { R[k] = i; guardaBorrador(); q.classList.remove('miss'); }; g.append(h('label', {}, inp, h('span', {}, String(i)))); }
    const q = h('div', { class: 'pq', id: 'q_' + k }); return [q, g, h('div', { class: 'extremos' }, h('span', {}, a), h('span', {}, b))];
  };
  const preg = (n, k, t, a, b) => { const [q, g, ex] = escala(k, a, b); q.append(h('b', {}, n + '. ' + t), g, ex); return q; };
  const lista = (n, k, extra) => {
    const q = h('div', { class: 'pq', id: 'q_' + k }, h('b', {}, n + '. ' + CL[k][0] + ' (marca las que apliquen)'));
    CL[k][1].forEach((t, i) => { const inp = h('input', { type: 'checkbox', value: i + 1 }); inp.checked = R[k].includes(i + 1);
      inp.onchange = () => { R[k] = inp.checked ? R[k].concat(i + 1) : R[k].filter(x => x !== i + 1); guardaBorrador(); q.classList.remove('miss'); };
      q.append(h('label', { class: 'check' }, inp, h('span', {}, t))); });
    if (extra) q.append(extra); return q;
  };
  const texto = (n, k, t, ph) => { const ta = h('textarea', { placeholder: ph || 'Escribe aquí…' }); ta.value = R[k] || ''; ta.oninput = () => { R[k] = ta.value; guardaBorrador(); }; return h('div', { class: 'pq' }, h('b', {}, n + '. ' + t), ta); };
  const sec = (L, [t, d]) => h('div', { class: 'secC' }, h('b', {}, L), h('div', {}, t, h('small', {}, d)));
  const otro = h('input', { type: 'text', placeholder: 'Otro (escríbelo aquí)', value: R.q10_otro || '', style: 'margin-top:4px' }); otro.oninput = () => { R.q10_otro = otro.value; guardaBorrador(); };
  const [qN, gN, exN] = escala('q11', '0 = Nunca lo haría', '10 = ¡Sin dudarlo!', 11, 0);
  qN.append(h('b', {}, '11. ¿Con qué probabilidad recomendarías MIELSY a un familiar o amigo?'), gN, exN);
  const fb = h('p', { class: 'fb' });
  const enviar = async (e) => {
    const falta = ['q1', 'q2', 'q3', 'q4', 'q5', 'q6', 'q7', 'q8', 'q11', 'q12', 'q13', 'q14', 'q17', 'q18'].filter(k => R[k] == null).concat(R.q10.length || (R.q10_otro || '').trim() ? [] : ['q10']);
    document.querySelectorAll('.pq.miss').forEach(x => x.classList.remove('miss'));
    if (falta.length) { falta.forEach(k => { const el = document.getElementById('q_' + k); if (el) el.classList.add('miss'); }); fb.className = 'fb bad'; fb.textContent = 'Faltan ' + falta.length + ' respuestas (marcadas en rojo).'; document.getElementById('q_' + falta[0]).scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    if (!R.q10.length) R.q10 = [];
    e.target.disabled = true; fb.className = 'fb'; fb.textContent = 'Enviando…';
    const r = await api('guardarCierre', { sesion: LS.get(K_SES), respuestas: R }); e.target.disabled = false;
    if (!r.ok) { fb.className = 'fb bad'; fb.textContent = r.error === 'RED' ? 'Sin conexión. Tus respuestas quedan guardadas en este teléfono; inténtalo de nuevo.' : msg(r.error); return; }
    P.cierre = r.cierre; LS.del(draftK); LS.set('mielsy.plan.cache', P);
    $('#main').replaceChildren(h('div', { class: 'card base' }, h('h2', {}, '¡Gracias! 🌿'), h('p', {}, 'Tu experiencia es valiosa y nos ayuda a seguir mejorando el Ecosistema MIELSY.'),
      [h('p', {}, 'El siguiente paso es tu reevaluación IEBI-M13: verás tu cambio en cada dimensión y recibirás tu siguiente plan.'), h('a', { class: 'btn gold', href: P.reevalUrl }, 'Responder mi reevaluación')],
      h('button', { class: 'btn ghost', onclick: () => ir('hoy') }, 'Volver a Hoy'))); window.scrollTo(0, 0);
  };
  if (P.dia < (P.diaCierre || 30)) return [h('div', { class: 'card locked' }, h('p', {}, 'El cuestionario de cierre se abre el día 30 de tu plan.'))];
  return [h('div', { class: 'card cierreCta' }, h('h1', { style: 'color:#fff' }, 'Cuestionario de cierre'), h('p', {}, '30 días de bienestar integral. Tu experiencia nos ayuda a mejorar. ¡Gracias por compartirla!'),
      P.cierre ? h('p', {}, h('b', {}, 'Ya lo respondiste el ' + new Date(P.cierre.fecha).toLocaleDateString('es', { day: 'numeric', month: 'long' }) + '.'), ' Puedes corregir tus respuestas y volver a enviarlas.') : h('p', { style: 'opacity:.95' }, '21 preguntas · unos 5 minutos. Se guarda en este teléfono mientras respondes.')),
    h('div', { class: 'card' }, sec('A', CQ.A), CQ.A[2].map((q, i) => preg(i + 1, ...q))),
    h('div', { class: 'card' }, sec('B', CQ.B), CQ.B[2].map((q, i) => preg(i + 6, ...q)), lista(9, 'q9'), lista(10, 'q10', otro)),
    h('div', { class: 'card' }, sec('C', CQ.C), qN, CQ.C[2].map((q, i) => preg(i + 12, ...q)),
      texto(15, 'q15', '¿Qué fue lo que MÁS te gustó de tu experiencia con MIELSY?'), texto(16, 'q16', '¿Qué mejorarías o cambiarías del programa?')),
    h('div', { class: 'card' }, sec('D', CQ.D), CQ.D[2].map((q, i) => preg(i + 17, ...q)), lista(19, 'q19'), lista(20, 'q20')),
    h('div', { class: 'card' }, sec('E', ['Tu mensaje final ✨', 'Este espacio es completamente tuyo.']), texto(21, 'q21', '¿Hay algo más que quieras contarnos sobre tu experiencia de 30 días con MIELSY?', 'Lo que quieras compartir con el equipo MIELSY…'),
      fb, h('button', { class: 'btn gold', onclick: enviar }, P.cierre ? 'Guardar cambios' : 'Enviar mi cuestionario'))];
}

/* ---------- inicio ---------- */
if (!CFG.API_URL || /PEGAR_AQUI/.test(CFG.API_URL)) { $('#main').append(h('div', { class: 'card' }, h('p', { class: 'fb bad' }, 'Falta configurar la dirección del servidor en config-iebi.js.'))); return; }
const m = location.hash.match(/[#&]s=([^&]+)/);
if (m) { LS.set(K_SES, decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); }
window.addEventListener('online', enviarPendientes);
cargar();
})();
</script>
